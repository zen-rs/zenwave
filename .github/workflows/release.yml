name: Release

# Every push to `main` runs both jobs: `release` publishes what the push
# carries (the required `CI result` check on `main` already guarantees the
# merged commit passed the full CI set), and `release-pr` opens or refreshes
# the version bump and changelog pull request against `main`. Merging that
# pull request is the release.
on:
  push:
    branches: [main]

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      checks: read
      id-token: write
    concurrency:
      group: release-publish-main
      cancel-in-progress: false
    steps:
      - name: Checkout the pushed main commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - &rust-toolchain
        name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      # Mint a short-lived crates.io token from the GitHub OIDC identity
      # instead of a stored CARGO_REGISTRY_TOKEN (trusted publishing is
      # configured per crate on crates.io).
      # The crate carries the pinned snapshots so that building it from
      # crates.io needs no network; `build.rs` checks each against its pin
      # again.
      - name: Fetch the pinned snapshots
        run: |
          set -euo pipefail
          for pinned in onecrl.pin.json:onecrl.json public_suffix.pin.json:public_suffix_list.dat; do
            pin="${pinned%%:*}"
            file="${pinned##*:}"
            url=$(jq -er .url "$pin")
            sha256=$(jq -er .sha256 "$pin")
            curl -fsSL --retry 5 --retry-all-errors -o "$file" "$url"
            echo "$sha256  $file" | sha256sum -c -
          done
      - uses: rust-lang/crates-io-auth-action@v1
        id: crates-io-auth
      - name: Publish unpublished crate version
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

  release-pr:
    name: Prepare next release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # The dispatch below starts CI on the release branch.
      actions: write
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    steps:
      - name: Checkout the pushed main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - *rust-toolchain
      - name: Create or update release PR
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # A pull request opened or pushed under GITHUB_TOKEN starts no
      # workflow, so the required `CI result` would never report on it;
      # dispatching CI on its branch is the exception GITHUB_TOKEN allows.
      - name: Run CI on the release branch
        if: steps.release-plz.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.release-plz.outputs.pr }}
        run: gh workflow run ci.yml -R "$GITHUB_REPOSITORY" --ref "$(jq -er .head_branch <<<"$PR")"
