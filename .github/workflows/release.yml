name: Release

# `release` publishes on pushes to `main`; the required `CI result` check
# there already guarantees a merged commit passed the full CI set, so the
# job does not wait on checks itself. `release-pr` runs on pushes to
# `dev` and keeps the version bump and changelog pull request open
# against `dev`. The bump belongs on `dev` because a pull request opened
# with the default `GITHUB_TOKEN` starts no workflow runs, so one
# targeting `main` could never satisfy the required check there and no
# release could ever be merged.
on:
  push:
    branches: [main, dev]

jobs:
  release:
    name: Publish release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      checks: read
      id-token: write
    concurrency:
      group: release-publish-main
      cancel-in-progress: false
    steps:
      - name: Checkout the pushed main commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - &rust-toolchain
        name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      # Mint a short-lived crates.io token from the GitHub OIDC identity
      # instead of a stored CARGO_REGISTRY_TOKEN (trusted publishing is
      # configured per crate on crates.io).
      # The crate carries the pinned OneCRL snapshot so that building it from
      # crates.io needs no network; `build.rs` checks it against the pin again.
      - name: Fetch the pinned OneCRL snapshot
        run: |
          set -euo pipefail
          url=$(jq -er .url onecrl.pin.json)
          sha256=$(jq -er .sha256 onecrl.pin.json)
          curl -fsSL --retry 5 --retry-all-errors -o onecrl.json "$url"
          echo "$sha256  onecrl.json" | sha256sum -c -
      - uses: rust-lang/crates-io-auth-action@v1
        id: crates-io-auth
      - name: Publish unpublished crate version
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

  release-pr:
    name: Prepare next release
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-dev
      cancel-in-progress: false
    steps:
      - name: Checkout tested dev commit
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tested commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "::error::dev moved after this push: expected $EXPECTED_SHA, checked out $actual_sha"
            exit 1
          fi
      - *rust-toolchain
      # The pull request lands the bump on `dev`; the release itself is the
      # `dev` -> `main` pull request that carries it, which runs the full
      # check set.
      - name: Create or update release PR
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
