[package]
name = "zenwave"
version = "0.6.0"
edition = "2024"
authors = ["Lexo Liu<me@lexo.cool>"]
repository = "https://github.com/zen-rs/zenwave"
description = "Ergonomic HTTP client framework."
license = "MIT"
keywords = ["http", "client", "async", "networking", "middleware"]
categories = ["network-programming", "web-programming::http-client"]

[dependencies]
http-kit = "0.4"
serde = { version = "1.0", default-features = false, features = ["derive"]}
serde_json = "1.0"
base64 = "0.22"
url = "2.5"
futures-util = { version = "0.3", features = ["io", "sink"] }
futures-channel = "0.3"
thiserror = "2.0"
futures-io = "0.3"
async-lock = "3.4"
anyhow = "1.0.100"
js-sys = "0.3.82"
http = "1.3.1"
httpdate = "1.0"
tracing = "0.1"

[dev-dependencies]
serde_json = "1.0"
tempfile = "3.13"
test_executors = "0.4"
tiny_http = "0.12"
futures-executor = "0.3"
httparse = "1.10"

[build-dependencies]
cfg_aliases = "0.2"

[features]
# Default: hyper transport, rustls verified by the operating system's trust
# store (`rustls-platform-verifier`), websockets. On wasm32 the built-in Fetch
# backend is always used and none of the native features apply.
default = ["hyper-backend", "rustls", "ws"]

# HTTP backends (native platforms only). At least one must be enabled.
#
# hyper over async-io/async-net. Needs exactly one TLS engine (`rustls` or `native-tls`).
hyper-backend = []
# libcurl via the `curl` crate. libcurl brings its own TLS engine.
curl-backend = ["dep:curl", "dep:blocking", "dep:rustls-native-certs", "dep:pem"]
# Apple's NSURLSession (macOS/iOS only). Security.framework does the TLS.
apple-backend = ["dep:block", "dep:objc", "dep:security-framework", "dep:core-foundation"]

# TLS engines for `hyper-backend` and native websockets. Exactly one may be enabled.
#
# rustls, with certificate verification delegated to the platform
# (Security.framework, CryptoAPI, Android Trust Manager, or the system CA bundle on Linux).
rustls = [
    "dep:futures-rustls",
    "dep:rustls",
    "dep:rustls-platform-verifier",
    "dep:jni",
    "dep:ndk-context",
]
# The platform's native TLS library (OpenSSL, SChannel, or Security.framework).
native-tls = ["dep:async-native-tls", "dep:native-tls"]

# Shorthands.
hyper-rustls = ["hyper-backend", "rustls"]
hyper-native-tls = ["hyper-backend", "native-tls"]

# Websocket support (async-tungstenite on native, web-sys WebSocket on wasm).
ws = ["dep:async-tungstenite"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = [
    "Window",
    "Request",
    "RequestInit",
    "Headers",
    "ReadableStream",
    "Response",
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "ErrorEvent",
    "BinaryType",
] }
wasm-streams = "0.5"
wasm-bindgen = "0.2.105"
wasm-bindgen-futures = "0.4.55"
gloo-timers = { version = "0.3", features = ["futures"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
smol = "2.0"
rcgen = "0.14"
futures-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-io = "2.4"
async-net = "2.0"
blocking = { version = "1.6", optional = true }
curl = { version = "0.4", optional = true }
dns-lookup = "3.0"
executor-core = { version = "0.7.0" }
hyper = { version = "1.8", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["client-proxy", "client-proxy-system"] }
http-body-util = "0.1.3"
async-native-tls = { version = "0.5.0", optional = true, default-features = false, features = ["runtime-async-std"] }
futures-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = { version = "0.7", optional = true }
rustls-pki-types = { version = "1.12", features = ["std"] }
rustls-native-certs = { version = "0.8", optional = true }
pem = { version = "4", optional = true }
native-tls = { version = "0.2", optional = true }
async-tungstenite = { version = "0.34.0", default-features = false, features = ["smol-runtime"], optional = true }
async-fs = { version = "2.2.0", default-features = false }
dirs = "6.0"
once_cell = "1.19"
time = "0.3.47"
tower-service = "0.3"

[target.'cfg(target_vendor = "apple")'.dependencies]
block = { version = "0.1", optional = true }
objc = { version = "0.2", optional = true }
security-framework = { version = "3.7", optional = true }
core-foundation = { version = "0.10", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22", optional = true }
ndk-context = { version = "0.1", optional = true }


[[example]]
name = "basic_get"
required-features = ["hyper-backend"]

[[example]]
name = "custom_client"
required-features = ["hyper-backend"]

[[example]]
name = "websocket_echo"
required-features = ["hyper-backend", "ws"]

[lints]
rust.missing_docs = "warn"
rust.missing_debug_implementations = "warn"
rust.unexpected_cfgs = "allow"
clippy.all = "warn"
clippy.style = "warn"
clippy.correctness = "warn"
clippy.complexity = "warn"
clippy.suspicious = "warn"
clippy.perf = "warn"
clippy.pedantic = "warn"
clippy.nursery = "warn"
clippy.cargo = "allow"
