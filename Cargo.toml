[package]
name = "zenwave"
version = "0.12.0"
edition = "2024"
authors = ["Lexo Liu<me@lexo.cool>"]
repository = "https://github.com/zen-rs/zenwave"
description = "Ergonomic HTTP client framework."
license = "MIT"
keywords = ["http", "client", "async", "networking", "middleware"]
categories = ["network-programming", "web-programming::http-client"]
# The tracked files plus the pinned OneCRL snapshot and Public Suffix List,
# which stay out of git (`.gitignore`) and are fetched by the release
# workflow before publishing.
include = [
    "/.github/**",
    "/examples/**",
    "/scripts/**",
    "/src/**",
    "/tests/**",
    "/.gitignore",
    "/AGENTS.md",
    "/CHANGELOG.md",
    "/CLAUDE.md",
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/build.rs",
    "/clippy.toml",
    "/onecrl.json",
    "/onecrl.pin.json",
    "/public_suffix.pin.json",
    "/public_suffix_list.dat",
    "/release-plz.toml",
]

[dependencies]
http-kit = "0.8.0"
serde ={ version = "1.0.229", default-features = false, features = ["derive"]}
serde_json = "1.0.154"
base64 = "0.23.1"
url = "2.5.8"
futures-util = { version = "0.3.34", features = ["io", "sink"] }
futures-channel = "0.3.34"
thiserror = "2.0.21"
futures-io = "0.3.34"
async-lock = "3.4.2"
anyhow = "1.0.104"
http = "1.5.0"
httpdate = "1.0.3"
tracing = "0.1.44"
cookie_store = { version = "0.22.1", default-features = false, features = [
    "serde_json",
] }
# The list itself is compiled in by `build.rs` from the pinned, hash-verified
# `public_suffix_list.dat`.
publicsuffix = { version = "2.3.0", default-features = false, optional = true }

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
# Held at 0.4: 0.6 drops `#[async_test]` for `wasm_lite_test`, which does not
# link on native Windows yet (zen-rs/zenwave#128).
test_executors = "0.4.1"
futures-executor = "0.3.34"
httparse = "1.10.1"
# `tokio::io` traits for the raw `h2` server in the hyper test fixtures.
tokio = { version = "1.54.1", features = ["io-util"] }

[build-dependencies]
cfg_aliases = "0.2.2"
# Compile the pinned OneCRL snapshot into `OUT_DIR` (`onecrl` feature): parse
# and validate it, hash-check it against the pin, and fetch it when the crate
# does not package onecrl.json.
serde_json = { version = "1.0.154", optional = true }
base64 = { version = "0.23.1", optional = true }
ring = { version = "0.17.14", optional = true, default-features = false }
minreq = { version = "3.0.0", optional = true, default-features = false, features = ["https-rustls"] }
# Version floor only: `minreq`'s `https-rustls` TLS trusts this Mozilla bundle,
# and pre-1.0.10 releases ship the distrusted emSign root (RUSTSEC-2026-0383).
webpki-roots = { version = "1.0.11", optional = true }

[features]
# Default: hyper transport, rustls verified by the operating system's trust
# store (`rustls-platform-verifier`), websockets, HTTP/2 and HTTP/3. On wasm32
# the built-in Fetch backend is always used and none of the native features
# apply.
default = ["hyper-backend", "rustls", "ws", "http2", "http3", "onecrl", "public-suffix"]

# HTTP backends (native platforms only). At least one must be enabled.
#
# hyper over async-io/async-net. Needs a TLS engine (`rustls` or `native-tls`).
hyper-backend = ["getaddrinfo"]
# `getaddrinfo` as a resolver (`zenwave::dns::Getaddrinfo`), one thread per
# query. Every backend that resolves names itself enables it; a native backend
# over a resolver of the caller's own needs none of it.
getaddrinfo = ["dep:dns-lookup", "dep:http-kit-io"]
# HTTP/2 for the hyper backend, negotiated with the server through ALPN.
# Off by default only in `default-features = false` builds.
http2 = ["hyper/http2", "dep:h2"]
# libcurl via the `curl` crate. libcurl brings its own TLS engine.
curl-backend = ["dep:curl", "dep:blocking", "dep:rustls-native-certs", "dep:pem"]
# Apple's NSURLSession (macOS/iOS only). Security.framework does the TLS.
apple-backend = ["dep:block", "dep:objc", "dep:security-framework", "dep:core-foundation"]

# TLS engines for `hyper-backend` and native websockets. Features are additive:
# when both are enabled, `rustls` takes precedence.
#
# rustls, with certificate verification delegated to the platform
# (Security.framework, CryptoAPI, Android Trust Manager, or the system CA bundle on Linux).
rustls = [
    "dep:futures-rustls",
    "dep:rustls",
    "dep:rustls-platform-verifier",
    "dep:webpki-root-certs",
    "dep:webpki-roots",
]
# The platform's native TLS library (OpenSSL, SChannel, or Security.framework),
# driven on futures-io streams by an in-tree adapter.
native-tls = ["dep:native-tls"]

# The runtime-neutral backend on `http-kit-io`'s owned-buffer sockets:
# HTTP/1.1 through `http-kit-h1`, TLS through `http-kit-tls` (rustls, verified
# as the hyper backend verifies). It runs on whichever runtime the caller's
# thread runs; `native-compio` or `native-tokio` adds that runtime as the
# driver behind `NativeBackend::new` for callers on no runtime at all. It is
# the default backend only when `hyper-backend` is off.
#
# On Linux and Android a response body whose consumer offers a pipe arrives
# as `BodyFrame::Pipe` frames, and a switched stream can be spliced
# (`Switched::into_splice`); elsewhere the `pipe` features compile to nothing.
native-backend = [
    "rustls",
    "dep:http-kit-io",
    "dep:http-kit-h1",
    "dep:http-kit-tls",
    "http-kit/pipe",
    "http-kit-h1/pipe",
]
# compio (io_uring, IOCP, polling) for the native backend.
native-compio = ["native-backend", "getaddrinfo", "http-kit-io/compio", "executor-core/compio", "dep:compio"]
# tokio's reactor for the native backend.
native-tokio = ["native-backend", "getaddrinfo", "http-kit-io/tokio", "executor-core/tokio", "dep:tokio"]
# HTTP/3 for the native backend through `http-kit-h3` (quiche; builds
# BoringSSL with cmake). The server's chain goes to the same verifier as a TCP
# connection's: the platform verifier with the transport's extra roots, and
# OneCRL where it applies.
native-http3 = ["native-backend", "dep:http-kit-h3", "http-kit-h3/quiche", "http-kit-h3/pipe"]

# Kernel TLS for the native backend on Linux: once a handshake completes and
# the kernel takes the negotiated suite, the connection's record layer moves
# to the kernel. A connection the kernel cannot take stays in user space.
# Compiles to nothing elsewhere.
native-kernel-tls = ["native-backend", "http-kit-tls/kernel"]

# Shorthands.
hyper-rustls = ["hyper-backend", "rustls"]
hyper-native-tls = ["hyper-backend", "native-tls"]

# Websocket support (async-tungstenite on native, web-sys WebSocket on wasm).
ws = ["getaddrinfo", "dep:async-tungstenite"]

# HTTP/3 over QUIC for the hyper backend. QUIC needs a QUIC-capable TLS
# library, so it requires the `rustls` engine.
http3 = ["rustls", "dep:bytes", "dep:h3", "dep:h3-quinn", "dep:quinn"]

# Refuse certificates listed by Mozilla's OneCRL on the paths that verify
# chains with webpki (`src/transport/onecrl.rs`). A pinned snapshot of the
# list is compiled into the binary by `build.rs`; Apple and Windows builds
# carry no table, since their OS trust service ships its own distrust.
onecrl = ["rustls", "getaddrinfo", "dep:webpki", "dep:ring", "dep:minreq", "dep:serde_json", "dep:base64", "dep:arc-swap", "dep:webpki-roots"]

# Reject cookie `Domain` attributes naming a public suffix (RFC 6265 §5.3) in
# the cookie middleware: `build.rs` compiles the pinned, hash-verified Public
# Suffix List in and `cookie_store` checks each Domain against it.
public-suffix = [
    "cookie_store/public_suffix",
    "dep:publicsuffix",
    "dep:minreq",
    "dep:ring",
    "dep:serde_json",
    "dep:webpki-roots",
]

# The browser and Workers Fetch backend: wasm32 without a WASI host.
[target.'cfg(all(target_arch = "wasm32", not(target_os = "wasi")))'.dependencies]
# Capped at the wasm-bindgen 0.2.120 generation: `tests/workerd` deploys through
# the `skyzen` CLI, whose embedded bindings generator is wasm-bindgen 0.2.120
# and refuses any other resolved version. js-sys/web-sys 0.3.98+ and
# wasm-bindgen 0.2.121+ cannot satisfy that pin, so the declared minimums must
# not exclude 0.2.120-generation releases.
js-sys = "0.3.97"
web-sys = { version = "0.3.97", features = [
    "Window",
    "Request",
    "RequestInit",
    "Headers",
    "ReadableStream",
    "Response",
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "ErrorEvent",
    "BinaryType",
] }
# Held at 0.5: each wasm-streams release exports the same `#[wasm_bindgen]`
# glue symbols, so two versions in one module fail to link, and skyzen (the
# `tests/workerd` worker) still depends on 0.5 (zen-rs/skyzen#39).
wasm-streams = "0.5.0"
wasm-bindgen = "0.2.120"
wasm-bindgen-futures = "0.4.70"
gloo-timers = { version = "0.4.0", features = ["futures"] }
# `time` needs its wasm-bindgen shim to read the clock on wasm32;
# cookie_store turns it on for expiry checks.
cookie_store = { version = "0.22.1", default-features = false, features = [
    "wasm-bindgen",
] }

[target.'cfg(all(target_arch = "wasm32", not(target_os = "wasi")))'.dev-dependencies]
wasm-bindgen-test = "0.3.79"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
smol = "2.0.2"
rcgen = "0.14.10"
futures-rustls = { version = "0.26.0", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
hyper = { version = "1.12.0", features = ["server", "http1", "http2"] }
# The websocket echo endpoint in `tests/common/fixture.rs`.
async-tungstenite = { version = "0.35.0", default-features = false, features = ["smol-runtime"] }

# What the native backend over a caller's `http-kit-io` sockets needs, on every
# native target including WASI, whose host supplies sockets, resolver and clock.
[target.'cfg(any(not(target_arch = "wasm32"), target_os = "wasi"))'.dependencies]
async-trait = "0.1.92"
executor-core = { version = "0.7.2" }
# The native backend: owned-buffer sockets, HTTP/1.1 and TLS on them.
http-kit-io = { version = "0.6.1", optional = true }
http-kit-h1 = { version = "0.6.0", optional = true }
http-kit-tls = { version = "0.4.0", optional = true }
futures-rustls = { version = "0.26.0", optional = true, default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23.46", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
# The environment's proxy rules (`transport::proxy`).
hyper-util = { version = "0.1.21", default-features = false, features = ["client-proxy", "client-proxy-system"] }
bytes = { version = "1.12.1", optional = true }
async-fs = { version = "2.2.0", default-features = false }
dirs = "7.0.0"
once_cell = "1.21.4"
time = "0.3.55"
tower-service = "0.3.3"

# WASI has no platform trust store to verify against: Mozilla's roots are
# compiled in, through the `rustls` feature.
[target.'cfg(target_os = "wasi")'.dependencies]
webpki-roots = { version = "1.0.11", optional = true }

# What needs an OS reactor or a platform with processes and sockets of its own
# (async-io's `polling` has no WASI backend): the async-io/async-net sockets
# and timers, `getaddrinfo`, hyper, hickory, curl, QUIC and the driver runtimes.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-io = "2.6.0"
async-net = "2.0.0"
blocking = { version = "1.7.0", optional = true }
curl = { version = "0.4.51", optional = true }
dns-lookup = { version = "4.0.2", optional = true }
# HTTP/3 for the native backend: quiche.
http-kit-h3 = { version = "0.6.0", optional = true }
compio = { version = "0.19.2", default-features = false, features = ["runtime"], optional = true }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "time"], optional = true }
hickory-proto = { version = "0.26.3", default-features = false, features = ["std"] }
hickory-resolver = { version = "0.26.3", default-features = false, features = ["system-config"] }
hyper = { version = "1.12.0", default-features = false, features = ["client", "http1"] }
# The h2 error type the hyper backend inspects to recognize a remote GOAWAY.
h2 = { version = "0.4.20", optional = true }
http-body-util = "0.1.5"
rustls-native-certs = { version = "0.8.5", optional = true }
pem = { version = "4.0.0", optional = true }
native-tls = { version = "0.2.18", optional = true, features = ["alpn"] }
async-tungstenite = { version = "0.35.0", default-features = false, features = ["smol-runtime"], optional = true }
quinn = { version = "0.11.12", default-features = false, features = ["rustls-ring"], optional = true }
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }
# Nonblocking socket work in `transport::dns::runtime` and `transport::quic`.
socket2 = "0.6.5"

# The OneCRL baseline applies where `rustls` chains are checked by webpki:
# every native target (WASI included, over its compiled-in roots) but Apple and
# Windows (whose trust services distrust on their own) and the browser (no
# native TLS at all).
[target.'cfg(all(any(not(target_arch = "wasm32"), target_os = "wasi"), not(target_vendor = "apple"), not(windows)))'.dependencies]
webpki = { package = "rustls-webpki", version = "0.103.16", optional = true, default-features = false, features = ["alloc"] }
ring = { version = "0.17.14", optional = true, default-features = false }
# The refresher swaps in a merged additions table per round.
arc-swap = { version = "1.9.3", optional = true, default-features = false }

# Android resolves HTTPS records through `android.net.DnsResolver` over JNI
# (src/transport/dns/android.rs); `jni-min-helper` supplies the Java proxy that
# delivers the callback into Rust.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
ndk-context = "0.1.1"
jni-min-helper = "0.4.7"

[target.'cfg(target_vendor = "apple")'.dependencies]
block = { version = "0.1.6", optional = true }
objc = { version = "0.2.7", optional = true }
security-framework = { version = "3.7.0", optional = true }
core-foundation = { version = "0.10.1", optional = true }

# Android verifies against the system anchors on disk instead (src/transport/android.rs);
# wasm32 never links rustls at all.
[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
rustls-platform-verifier = { version = "0.7.1", optional = true }
# Version floor only: `rustls-platform-verifier` declares `webpki-root-certs`
# as `1`, and pre-1.0.10 releases ship the distrusted emSign root
# (RUSTSEC-2026-0383). Not named in code.
webpki-root-certs = { version = "1.0.11", optional = true }

# `EINPROGRESS` from a nonblocking `connect` in `transport::dns::runtime`.
[target.'cfg(all(unix, not(target_os = "android")))'.dependencies]
libc = "0.2.191"


[[example]]
name = "basic_get"
required-features = ["hyper-backend"]

[[example]]
name = "custom_client"
required-features = ["hyper-backend"]

[[example]]
name = "websocket_echo"
required-features = ["hyper-backend", "ws"]

# `webpki-roots` and `webpki-root-certs` are version floors for transitive
# users (minreq's TLS, rustls-platform-verifier's wasm32 path); no source file
# names them.
[package.metadata.cargo-machete]
ignored = ["webpki-roots", "webpki-root-certs"]

[lints]
rust.missing_docs = "warn"
rust.missing_debug_implementations = "warn"
rust.unexpected_cfgs = "allow"
clippy.all = "warn"
clippy.style = "warn"
clippy.correctness = "warn"
clippy.complexity = "warn"
clippy.suspicious = "warn"
clippy.perf = "warn"
clippy.pedantic = "warn"
clippy.nursery = "warn"
clippy.cargo = "allow"
