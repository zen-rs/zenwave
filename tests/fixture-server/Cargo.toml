# Standalone binary that serves the shared httpbin fixture
# (`zenwave-test-fixture`, the workspace crate under `tests/fixture`) over TCP,
# so the wasm-pack and workerd lanes can reach it from the browser or the
# Workers runtime. Not a workspace member: like tests/workerd it is built on
# demand by the scripts that need it.
[package]
name = "zenwave-test-fixture-bin"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "zenwave-test-fixture"
path = "src/main.rs"

[dependencies]
zenwave-test-fixture = { path = "../fixture" }
