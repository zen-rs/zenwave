[package]
name = "zenwave-test-fixture"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false
description = "Local test servers and harness shared by zenwave's integration tests."

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
smol = "2.0.2"
rcgen = "0.14.10"
time = "0.3.55"
once_cell = "1.21.4"
futures-util = { version = "0.3.34", default-features = false, features = ["std", "async-await", "io"] }
futures-io = "0.3.34"
async-io = "2.6.0"
base64 = "0.23.1"
serde_json = "1.0.154"
httparse = "1.10.1"
url = "2.5.8"

futures-rustls = { version = "0.26.0", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
hyper = { version = "1.12.0", features = ["server", "http1", "http2"] }
http-body-util = "0.1.5"
tokio = { version = "1.54.1", features = ["io-util"] }
async-tungstenite = { version = "0.35.0", default-features = false, features = ["smol-runtime"] }
async-net = "2.0.0"
