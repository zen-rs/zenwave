# A Cloudflare Worker that speaks HTTP through the zenwave checkout it sits
# in, run under workerd by `scripts/test-workerd.sh`. Not published, not a
# workspace member: it exists so CI exercises the Workers runtime itself,
# which browser wasm tests cannot (zen-rs/zenwave#19, #24).
[package]
name = "zenwave-workerd-smoke"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
skyzen = "0.2.1"
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
zenwave = { path = "../..", default-features = false }
# Must match the generator the `skyzen` CLI embeds; `skyzen doctor` reports it.
wasm-bindgen = "=0.2.120"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zenwave = { path = "../.." }

# skyzen's own transitive zenwave is the checkout under test too.
[patch.crates-io]
zenwave = { path = "../.." }
