# The Rust half of the instrumented Android test app under `tests/android`: a
# cdylib the Kotlin test loads to run zenwave's TLS cases, from a real
# application process, against the shared fixtures in `tests/common`. Not
# published, not a workspace member.
[package]
name = "zenwave-android-tests"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[features]
default = ["ws"]
# Mirrors zenwave's `ws` so the shared fixtures build their echo server too.
ws = ["zenwave/ws", "dep:async-tungstenite"]

[dependencies]
zenwave = { path = "../../..", default-features = false, features = ["hyper-backend", "rustls"] }
jni = "0.22"

# What `tests/common` needs.
async-net = "2.0"
async-tungstenite = { version = "0.34.0", default-features = false, features = ["smol-runtime"], optional = true }
base64 = "0.22"
futures-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
futures-util = { version = "0.3", features = ["io", "sink"] }
httparse = "1.10"
once_cell = "1.19"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0"
smol = "2.0"
time = "0.3"
tiny_http = "0.12"
url = "2.5"

# The fixtures live in `tests/common`, pulled in through `#[path]`; cargo-machete
# only scans this directory and so cannot see these being used.
[package.metadata.cargo-machete]
ignored = [
  "async-net",
  "async-tungstenite",
  "futures-rustls",
  "futures-util",
  "httparse",
  "once_cell",
  "rcgen",
  "rustls",
  "time",
  "tiny_http",
  "url",
]

# The checkout under test pins an unreleased http-kit; a path dependency
# does not carry its [patch], so it is repeated here.
[patch.crates-io]
http-kit = { git = "https://github.com/zen-rs/http-kit", rev = "d13bd9c2225230a508f014eb5b8dd88a2d562970" }
