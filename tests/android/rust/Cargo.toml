# The Rust half of the instrumented Android test app under `tests/android`: a
# cdylib the Kotlin test loads, which registers the Android context with
# ndk-context and then runs zenwave's TLS cases against the shared fixtures in
# `tests/common`. Not published, not a workspace member.
[package]
name = "zenwave-android-tests"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[features]
default = ["ws"]
# Mirrors zenwave's `ws` so the shared fixtures build their echo server too.
ws = ["zenwave/ws", "dep:async-tungstenite"]

[dependencies]
zenwave = { path = "../../..", default-features = false, features = ["hyper-backend", "rustls"] }
jni = "0.22"
ndk-context = "0.1"

# What `tests/common` needs.
async-net = "2.0"
async-tungstenite = { version = "0.34.0", default-features = false, features = ["smol-runtime"], optional = true }
base64 = "0.22"
futures-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
futures-util = { version = "0.3", features = ["io", "sink"] }
httparse = "1.10"
once_cell = "1.19"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0"
smol = "2.0"
time = "0.3"
tiny_http = "0.12"
url = "2.5"
